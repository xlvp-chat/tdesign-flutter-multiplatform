name: token_codegen
description: >
  PoC generator that turns TDesign CSS / css2token output into Dart token
  sources for tdesign_flutter_core (Desktop architecture baseline Phase 0).
version: 0.1.0-dev.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  css2token:
    path: ../../packages/css2token
  path: ^1.9.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.8
