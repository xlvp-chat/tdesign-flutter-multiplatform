name: tdesign_flutter_multi_adaptive
description: >
  Adaptive host signals. Resolves mobile or desktop mode from window size
  and input capability (not OS alone). Does not depend on Mobile or Desktop
  component packages (Spec 099).
version: 0.1.0
publish_to: none
homepage: https://github.com/xlvp-chat/tdesign-flutter-multiplatform
repository: https://github.com/xlvp-chat/tdesign-flutter-multiplatform

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^1.0.4
  flutter_test:
    sdk: flutter
